<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Uptime: Continuity Engine</title>
    <style>
        /* High-Contrast Zinc Palette */
        :root {
            --bg-base: #09090b; 
            --bg-surface: #18181b; 
            --bg-surface-hover: #27272a; 
            --border-subtle: #27272a;
            --border-strong: #3f3f46;
            
            --text-primary: #fafafa; 
            --text-secondary: #a1a1aa; 
            --text-tertiary: #71717a; 
            
            --accent-brand: #3b82f6; 
            --accent-brand-hover: #2563eb;
            --accent-brand-bg: rgba(59, 130, 246, 0.1);
            
            --status-danger: #ef4444;
            --status-danger-bg: rgba(239, 68, 68, 0.1);
            --status-warning: #f59e0b;
            --status-warning-bg: rgba(245, 158, 11, 0.1);
            --status-success: #10b981;
            --status-success-bg: rgba(16, 185, 129, 0.1);
            
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .project-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .project-card.active {
            border-color: var(--accent-brand);
            background-color: var(--accent-brand-bg);
            box-shadow: 0 0 0 1px var(--accent-brand);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
        }

        .risk-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .risk-critical { background: var(--status-danger-bg); color: var(--status-danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .risk-high { background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .risk-moderate { background: var(--accent-brand-bg); color: var(--accent-brand); border: 1px solid rgba(59, 130, 246, 0.2); }

        /* Inspector Panel Alignment */
        .inspector-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            flex-grow: 1;
        }

        .detail-row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            width: 100%;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            font-size: 0.9rem;
            color: var(--text-primary);
            background-color: var(--bg-base);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        .action-area {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: background-color var(--transition-fast), transform 50ms;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--accent-brand); color: white; }
        .btn-primary:hover { background-color: var(--accent-brand-hover); }
        .btn-success { background-color: var(--status-success); color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-secondary { background-color: var(--bg-surface-hover); color: var(--text-primary); border: 1px solid var(--border-strong); width: auto; padding: 0.6rem 1.5rem; }
        .btn-secondary:hover { background-color: var(--border-strong); }

        /* Registration Form Alignment FIX */
        .registration-panel { 
            grid-column: 1 / -1; 
            margin-top: 0.5rem; 
        }
        
        .form-grid { 
            display: grid; 
            /* Fixed to 2 columns instead of auto-fit to prevent squishing */
            grid-template-columns: 1fr 1fr; 
            gap: 1.5rem 1.25rem; 
            padding: 1.5rem; 
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 0.4rem; 
        }
        
        .form-group.full-width { 
            grid-column: 1 / -1; 
        }

                            Mark Cleared & Active
                        </button>
                    </div>
                `;
            } else {
                actionBox.innerHTML = `
                    <div class="action-area" style="text-align: center; color: var(--status-success); font-size: 0.875rem; font-weight: 600;">
                        ✓ Protocol fully cleared. Separation of Duties validated.
                    </div>
                `;
            }
        }

        function renderMatrix() {
            const tbody = document.getElementById('matrixTableBody');
            tbody.innerHTML = '';
            
            const sortedProjects = [...projects].sort((a,b) => {
                const riskVal = { "Critical": 3, "High": 2, "Moderate": 1 };
                return riskVal[b.risk] - riskVal[a.risk];
            });

            sortedProjects.forEach(p => {
                const pillClass = p.risk === 'Critical' ? 'risk-critical' : (p.risk === 'High' ? 'risk-high' : 'risk-moderate');
                tbody.innerHTML += `
                    <tr>
                        <td><span class="risk-badge ${pillClass}">${p.risk} Hazard</span></td>
                        <td>
                            <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">${p.name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-tertiary);">${p.zone}</div>
                        </td>
                        <td class="metric-highlight">${p.population || "TBD"}</td>
                        <td class="metric-money">${p.economicLoss || "TBD"}</td>
                        <td style="color: var(--text-secondary); max-width: 450px; font-size: 0.8rem;">${p.needs}</td>
                    </tr>
                `;
            });
        }

        function renderAuditLogs() {
            const container = document.getElementById('auditTimelineContainer');
            container.innerHTML = '';

            [...auditLogs].reverse().forEach(log => {
                container.innerHTML += `
                    <div class="log-entry ${log.type}">
                        <div class="log-meta-col">
                            <span class="log-time">${log.time}</span>
                            <span class="log-hash">${log.hash}</span>
                            <span class="log-auth">${log.auth}</span>
                        </div>
                        <div class="log-details">
                            <div class="log-action">${log.action}</div>
                            <div class="log-desc">${log.meta}</div>
                        </div>
                    </div>
                `;
            });
        }

        function transitionStatus(id, targetCategory, confirmMsg) {
            if (!window.confirm(confirmMsg)) return;

            const p = projects.find(item => item.id === id);
            if (p) {
                if (targetCategory === 'validating') {
                    p.statusCategory = 'validating';
                    p.statusText = 'Simultaneous Engineering Audit Active';
                    
                    auditLogs.push({
                        time: getTimestamp(),
                        hash: generateHash(),
                        auth: "EXECUTIVE DIRECTIVE",
                        type: "warning",
                        action: "Parallel Validation Overridden",
                        meta: `Gridlock bypassed for "${p.name}". Assumed continuous operations under oversight of ${p.auditor}.`
                    });

                } else if (targetCategory === 'cleared') {
                    p.statusCategory = 'cleared';
                    p.statusText = 'Cleared for Active Construction';
                    
                    auditLogs.push({
                        time: getTimestamp(),
                        hash: generateHash(),
                        auth: p.auditor.toUpperCase(),
                        type: "success",
                        action: "Third-Party Clearance Granted",
                        meta: `Independent verification finalized for "${p.name}". Absolute operational continuity restored without anomalies.`
                    });
                }
                renderEngine();
            }
        }

        function registerProject() {
            const name = document.getElementById('newName').value.trim();
            const zone = document.getElementById('newZone').value.trim();
            const risk = document.getElementById('newRisk').value;
            const budget = document.getElementById('newBudget').value.trim() || "₱0.00";
            const needs = document.getElementById('newNeeds').value.trim();

            if (!name || !needs) {
                alert('Form Error: Designation and Vulnerability Profile fields are mandatory.');
                return;
            }

            if (!window.confirm(`Are you certain you want to deploy "${name}" into the Project Uptime matrix? This action is immutable.`)) return;

            const newId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) + 1 : 1;

            projects.push({
                id: newId,
                name,
                zone: zone || "Unassigned Sector",
                risk,
                budget,
                auditor: "Woodfields Consultants Inc. (Auto-Assigned)",
                statusCategory: "investigating",
                statusText: "Awaiting Framework Integration",
                needs,
                population: "Awaiting Data",
                economicLoss: "Awaiting Data"
            });

            auditLogs.push({
                time: getTimestamp(),
                hash: generateHash(),
                auth: "DPWH ADMIN",
                type: "warning",
                action: "New Infrastructure Protocol Deployed",
                meta: `Project "${name}" injected into the Continuity Engine. Initially halted under ${risk} risk status pending third-party override.`
            });

            currentSelectedId = newId;
            renderEngine();

            document.getElementById('newName').value = '';
            document.getElementById('newZone').value = '';
            document.getElementById('newBudget').value = '';
            document.getElementById('newNeeds').value = '';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Init
        renderEngine();
    </script>
</body>
</html>
