<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybersecurity Exam Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Clean Light Theme */
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-strong: #cbd5e1;
            
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            
            --opt-bg: #ffffff;
            --opt-hover-bg: #f8fafc;
            
            --correct-bg: #f0fdf4;
            --correct-text: #166534;
            --correct-border: #22c55e;
            
            --wrong-bg: #fef2f2;
            --wrong-text: #991b1b;
            --wrong-border: #ef4444;
        }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        .header-title { color: var(--primary); font-weight: 800; font-size: 1.5rem; }
        @media (min-width: 768px) { .header-title { font-size: 2rem; } }
        
        .exam-container { max-width: 800px; margin: 0 auto; }
        
        /* Mobile-friendly Navigation */
        .nav-pills { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.5rem; justify-content: center; }
        .nav-pills::-webkit-scrollbar { display: none; }
        .nav-pills .nav-link {
            border-radius: 50px; padding: 0.5rem 1.25rem; font-weight: 600; font-size: 0.9rem;
            color: var(--text-muted); margin: 0 0.25rem; background: var(--surface);
            border: 1px solid var(--border-strong); white-space: nowrap; transition: all 0.2s;
        }
        .nav-pills .nav-link.active { 
            background-color: var(--primary); color: #fff; border-color: var(--primary); 
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); 
        }
        
        /* Card & Task Bar Styling */
        .card { 
            border: 1px solid var(--border-light); border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); background: var(--surface); 
            overflow: hidden; margin-bottom: 3rem;
        }
        
        .task-bar { background-color: #f1f5f9; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-light); }
        .task-bar-text { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; color: var(--text-muted); text-transform: uppercase; }
        
        .progress { height: 8px; border-radius: 0; background-color: var(--border-light); }
        .progress-bar { background-color: var(--primary); transition: width 0.4s ease; }
        
        .question-text { font-size: 1.15rem; font-weight: 600; color: #0f172a; margin-bottom: 1.5rem; line-height: 1.6; }
        @media (min-width: 768px) { .question-text { font-size: 1.3rem; margin-bottom: 2rem; } }
        
        /* Option Blocks */
        .option-block {
            display: flex; align-items: flex-start; padding: 1rem;
            margin-bottom: 0.75rem; border: 2px solid var(--border-light); border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease; background: var(--opt-bg);
        }
        .option-block:hover:not(.disabled) { border-color: var(--border-strong); background-color: var(--opt-hover-bg); }
        
        .option-letter { 
            font-weight: 700; background: #f1f5f9; color: var(--text-muted); 
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; 
            border-radius: 8px; margin-right: 1rem; flex-shrink: 0; font-size: 0.95rem;
        }
        .option-text { font-size: 1rem; color: var(--text-main); line-height: 1.5; padding-top: 0.25rem; }
        
        /* Selection States */
        .option-block.selected { border-color: var(--primary); background-color: var(--primary-light); }
        .option-block.selected .option-letter { background: var(--primary); color: #fff; }
        .option-block.disabled { cursor: not-allowed; opacity: 0.7; pointer-events: none; }
        
        /* Buttons */
        .btn-action { 
            border-radius: 12px; padding: 0.85rem 1.5rem; font-weight: 600; font-size: 1.05rem; 
            transition: all 0.2s; background-color: var(--primary); border: none; color: #fff;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        @media (min-width: 768px) { .btn-action { width: auto; min-width: 200px; } }
        .btn-action:hover:not(:disabled) { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .btn-action:disabled { background-color: var(--border-strong); color: var(--surface); }
        
        .btn-outline-action { background: transparent; border: 2px solid var(--border-strong); color: var(--text-main); }
        .btn-outline-action:hover { background: var(--border-light); color: var(--text-main); }
        
        .fade-transition { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Summary Review Items */
        .review-item { background: #fff; border: 1px solid var(--border-light); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .review-question { font-size: 1.05rem; font-weight: 600; margin-bottom: 1rem; color: #0f172a; }
        .review-badge { display: flex; align-items: flex-start; padding: 0.75rem; border-radius: 8px; font-weight: 500; font-size: 0.95rem; border: 1px solid transparent; margin-bottom: 0.5rem; }
        .review-badge i { margin-top: 0.15rem; margin-right: 0.5rem; }
        .review-badge.correct { background: var(--correct-bg); color: var(--correct-text); border-color: #bbf7d0; }
        .review-badge.wrong { background: var(--wrong-bg); color: var(--wrong-text); border-color: #fecaca; }
    </style>
</head>
<body>

<div class="container py-4 py-md-5 exam-container">
    <div class="text-center mb-4">
        <h2 class="header-title"><i class="fas fa-shield-check text-primary me-2"></i> Security Exam</h2>
        <p class="text-muted">Select a module to begin. Questions are randomized.</p>
    </div>
    
    <div class="d-flex justify-content-center mb-4">
        <ul class="nav nav-pills" id="setTabs">
            <li class="nav-item"><a class="nav-link active" onclick="loadSet(1)">Module 1</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadSet(2)">Module 2</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadSet(3)">Module 3</a></li>
        </ul>
    </div>

    <div class="card" id="quiz-card">
        <!-- Question View -->
        <div id="question-view">
            <!-- Process / Task Bar -->
            <div class="task-bar d-flex justify-content-between align-items-center">
                <span class="task-bar-text" id="module-indicator"><i class="fas fa-layer-group me-2"></i> Module 1</span>
                <span class="task-bar-text text-primary" id="question-counter">Q: 1 / 60</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
            
            <!-- Question Content -->
            <div class="card-body p-3 p-md-4 p-lg-5 fade-transition" id="card-body-content">
                <div class="question-text" id="question-text">Initializing...</div>
                
                <div id="options-container" class="mb-4">
                    <!-- Options injected here -->
                </div>
                
                <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                    <button class="btn btn-action" id="btn-next" onclick="nextQuestion()" disabled>
                        Next Question <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Summary View -->
        <div id="summary-view" style="display:none;" class="card-body p-3 p-md-5 text-center fade-transition">
            <div class="mb-3">
                <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            <h2 class="mb-2 fw-bold" style="color: #0f172a;">Module Completed</h2>
            <p class="text-muted mb-4">Here is your final performance review.</p>
            
            <div class="p-4 rounded-4 mb-4" style="background: #f8fafc; border: 1px solid #e2e8f0;">
                <h1 class="display-4 fw-bold text-primary mb-0"><span id="final-score">0</span> <span class="fs-3 text-muted">/ <span id="final-total">0</span></span></h1>
                <p class="text-muted fw-semibold mt-2 mb-0">Total Correct</p>
            </div>
            
            <div class="d-flex flex-column flex-md-row justify-content-center gap-3 mb-5">
                <button class="btn btn-action btn-outline-action w-100 w-md-auto" onclick="loadSet(currentSetNum)">
                    <i class="fas fa-redo-alt"></i> Retake Module
                </button>
                <button class="btn btn-action w-100 w-md-auto" onclick="loadNextSet()">
                    Next Module <i class="fas fa-forward"></i>
                </button>
            </div>
            
            <h4 class="text-start mb-3 fw-bold" style="color: #0f172a;">Detailed Review</h4>
            <div id="review-container" class="text-start">
                <!-- Review items injected here -->
            </div>
            
            <div class="mt-4 text-center">
                 <button class="btn btn-action btn-outline-action mx-auto w-auto" onclick="window.scrollTo(0,0)">
                     <i class="fas fa-arrow-up"></i> Back to Top
                 </button>
            </div>
        </div>
    </div>
</div>

<script>
    const rawExamData = {"set1": [{"question": "Which of the following is the HIGHEST level of security for media management?", "options": {"A": "Encrypted storage on a cloud-based server", "B": "Unencrypted storage on a local hard drive", "C": "Unencrypted storage on a removable USB drive", "D": "Encrypted storage on a physical server at a secure location"}, "correct": "D"}, {"question": "During a security review, an analyst discovers that employees are sharing passwords for convenience. What strategy should the organization implement to reduce this risk while maintaining productivity?", "options": {"A": "Implement multifactor authentication (MFA)", "B": "Encourage strong password creation", "C": "Shorten password expiration times", "D": "Conduct employee phishing training"}, "correct": "A"}, {"question": "In a Disaster Recovery Plan (DRP), which of the following strategies is focused on ensuring that critical business functions can continue during a disruption?", "options": {"A": "Incident response", "B": "Business continuity", "C": "Risk management", "D": "Disaster Recovery"}, "correct": "B"}, {"question": "What is the primary role of a Public Key Infrastructure (PKI) in an organizational setting?", "options": {"A": "Providing a framework for email encryption standards", "B": "Implementing network-level firewall security", "C": "Facilitating secure exchange of public keys", "D": "Ensuring database integrity through hashing"}, "correct": "C"}, {"question": "An organization is concerned about phishing attacks targeting their employees. Which of the following measures is most effective in mitigating this risk?", "options": {"A": "Conducting regular security awareness training", "B": "Implementing inbound email encryption", "C": "Deploying a comprehensive firewall solution", "D": "Installing antivirus software on all devices"}, "correct": "A"}, {"question": "An organization is implementing a new policy that requires all employees to use Multi-Factor Authentication (MFA) when accessing sensitive systems. Which of the following factors would best strengthen the security provided by MFA?", "options": {"A": "A password with a minimum of eight characters", "B": "A biometric factor, such as a fingerprint scan", "C": "A secure token sent via email", "D": "A knowledge-based question, such as What is your mother's maiden name?"}, "correct": "B"}, {"question": "Which of the following is the MOST important indicator of a vulnerable and outdated component on a network?", "options": {"A": "The component has a high number of failed login attempts", "B": "The component has not been patched recently", "C": "The component is running an older version of its operating system", "D": "The component is running software that is no longer supported by the vendor"}, "correct": "D"}, {"question": "Which of the following types of attacks is mitigated by using two-factor authentication?", "options": {"A": "Phishing", "B": "Successful brute-force password attempts", "C": "SQL injection", "D": "DDoS attack"}, "correct": "B"}, {"question": "An attacker gains entry into a network system using a compromised host machine. What type of tool might they use to maintain access over a long period without detection?", "options": {"A": "Worm", "B": "Trojan Horse", "C": "Rootkit", "D": "Botnet"}, "correct": "C"}, {"question": "Your company is experiencing an increase in cyberattacks, and you have been tasked with improving security protocols. What is the process of defining, implementing, and maintaining policies and procedures related to granting permissions to organizational resources?", "options": {"A": "Risk management lifecycle", "B": "Data management lifecycle", "C": "Access management lifecycle", "D": "Incident management lifecycle"}, "correct": "C"}, {"question": "As the IT director of a mid-sized tech startup, your organization is setting up a remote site in a rural area. Due to the remote location, your internet connectivity options are limited. You need a solution that offers decent internet speeds for your team's cloud-based workloads and video conferencing needs. The options available to you are DSL, Fiber (offered by a local power company), and Satellite Internet. Considering the location and the organization's needs, which internet connectivity solution should you choose?", "options": {"A": "DSL", "B": "Dial-Up", "C": "Fiber", "D": "Satellite Internet"}, "correct": "D"}, {"question": "Which of the following organizational processes is the MOST effective in preventing data breaches?", "options": {"A": "Conducting periodic security assessments", "B": "Implementing strict access controls", "C": "Implementing password policies", "D": "Implementing regular security training for employees"}, "correct": "D"}, {"question": "An employee is terminated for policy violations and is escorted out immediately. The manager asks IT to remove access. Which sequence best reflects immediate deprovisioning priorities?", "options": {"A": "Wait until the end of the day to disable accounts so the employee can retrieve personal files", "B": "Revoke physical access, disable network and email accounts, invalidate active sessions, then remove application access and tokens", "C": "Disable the user account next week after confirming that all assigned assets have been returned", "D": "Remove access to low risk applications first, then disable email after HR completes documentation"}, "correct": "B"}, {"question": "A company social networking application stores user credentials on the server without encryption. Which of the following solutions should be implemented to protect the credentials from unauthorized access?", "options": {"A": "Enforce a password expiration policy for user accounts", "B": "Encrypt the user credentials using a symmetric encryption algorithm", "C": "Implement an Intrusion Detection System to monitor access to credentials", "D": "Use a hashing algorithm to store user credentials"}, "correct": "D"}, {"question": "Which of the following is the MOST important factor to consider when implementing security measures in an organization?", "options": {"A": "The legislative and regulatory requirements", "B": "The level of user awareness and training", "C": "The cost of the measures", "D": "The level of technical expertise of the security team"}, "correct": "A"}, {"question": "A team is designing certificate based authentication for a new application. They want to ensure that even if an attacker copies the certificate file, the attacker still cannot authenticate. Which implementation choice most directly supports that goal?", "options": {"A": "Store the private key in a hardware backed keystore and mark it as non-exportable", "B": "Use the same certificate and private key for all users to simplify management", "C": "Allow users to email their certificate to themselves for easy setup on new devices", "D": "Use a self signed certificate for each user to avoid Certificate Authority (CA) dependencies"}, "correct": "A"}, {"question": "In incident management, which of these is NOT a recognized category of events and/or incidents?", "options": {"A": "Technical", "B": "Legal", "C": "Physical", "D": "Environmental"}, "correct": "D"}, {"question": "A company plans to transition to the cloud to improve scalability and reduce IT costs. What is the most critical aspect to consider to maintain data security during this transition?", "options": {"A": "Selecting a Cloud Service Provider (CSP) with a comprehensive Service Level Agreement (SLA).", "B": "Migrating to a cloud service with the lowest operational cost.", "C": "Encrypting data before moving it to the cloud.", "D": "Reducing employee access to cloud services."}, "correct": "C"}, {"question": "A company is planning to move its data storage to a Cloud Service Provider (CSP). What is a primary security concern that should be addressed before proceeding with the migration?", "options": {"A": "Backup and recovery procedures", "B": "Data availability", "C": "Data encryption at rest", "D": "Bandwidth limitations"}, "correct": "A"}, {"question": "A new employee at a financial institution is authorized to access certain databases for customer service purposes. But, during routine monitoring, it is discovered that this employee has accessed databases unrelated to their job responsibilities. Which of the following access control models would most effectively prevent this issue in the future?", "options": {"A": "Mandatory Access Control (MAC)", "B": "Discretionary Access Control (DAC)", "C": "Attribute-Based Access Control (ABAC)", "D": "Role-Based Access Control (RBAC)"}, "correct": "C"}, {"question": "In terms of identity and access management, which strategy helps minimize the risk of privilege escalation?", "options": {"A": "Utilizing redundant hardware to increase availability", "B": "Deploying host-based Intrusion Detection Systems", "C": "Implementing a network-based firewall with deep packet inspection", "D": "Applying the principle of least privilege in access control"}, "correct": "D"}, {"question": "Which of the following is the PRIMARY goal of risk mitigation?", "options": {"A": "To transfer the potential threat to a third party", "B": "To minimize the impact of a potential threat", "C": "To maximize the potential benefit of a potential threat", "D": "To eliminate the potential threat"}, "correct": "B"}, {"question": "Which of the following is the MOST important factor in determining a data retention policy?", "options": {"A": "Security of the data", "B": "Cost of storage", "C": "Ease of access", "D": "Legal requirements"}, "correct": "D"}, {"question": "Your organization has recently suffered a major data breach due to an employee leaving sensitive information on their desk while they were away from their workstation. As a result, your organization has decided to implement a clean desk policy to prevent future incidents like this from occurring. As the IT security manager, part of your duties is developing and implementing this policy. Which of the following should be included in the clean desk policy?", "options": {"A": "Employees should cover their desks with a clean cloth when they are away from their workstation", "B": "Employees should lock their desks when they are away from their workstation", "C": "Employees should remove all sensitive documents and equipment from their desks when they are away from their workstation", "D": "Employees should only leave their desks when they are away from their workstation"}, "correct": "B"}, {"question": "A company wants to secure its on-premises network segment from unauthorized devices. Which of the following technologies should be implemented to meet this goal?", "options": {"A": "Vulnerability Scanner", "B": "Network Access Control (NAC)", "C": "Network Address Translation (NAT)", "D": "Web Application Firewall (WAF)"}, "correct": "C"}, {"question": "Zahra is explaining the IAAA model to one of the directors from payroll. Which of these is NOT one of the A's from the model?", "options": {"A": "Access.", "B": "Authentication.", "C": "Accountability.", "D": "Authorization."}, "correct": "A"}, {"question": "Which of the following is the FIRST principle that should be considered when assessing and implementing secure design principles in network architectures?", "options": {"A": "Availability", "B": "Integrity", "C": "Confidentiality", "D": "Least privilege"}, "correct": "D"}, {"question": "A company has recently suffered a data breach involving the unauthorized access of customer information. Which of the following measures would be most effective in preventing similar breaches in the future?", "options": {"A": "Utilize a Virtual Private Network (VPN) for remote access", "B": "Conduct regular security awareness training for employees", "C": "Install a Network Intrusion Detection System (NIDS)", "D": "Implement full-disk encryption for all company devices"}, "correct": "B"}, {"question": "In a federated login flow, which component is responsible for authenticating the user and producing the identity information that the application consumes?", "options": {"A": "The identity provider", "B": "The firewall performing network address translation", "C": "The relying party application", "D": "The database server storing application data"}, "correct": "A"}, {"question": "A system administrator notices an unusual spike in network traffic from an internal user's workstation. What should be the first step in response to this observation?", "options": {"A": "Update the workstation's antivirus software", "B": "Collect and analyze network traffic logs for suspicious activity", "C": "Isolate the network connection of the workstation", "D": "Contact the user to verify any legitimate large data transfers"}, "correct": "B"}, {"question": "What is the primary purpose of implementing network segmentation in an enterprise environment?", "options": {"A": "To simplify network management by consolidating devices", "B": "To improve network security by restricting access between network segments", "C": "To enhance network performance by reducing traffic", "D": "To enable easier monitoring of user behavior on the network"}, "correct": "B"}, {"question": "Which of the following is not a requirement for secure password creation?", "options": {"A": "The password must include special characters", "B": "The password must be changed every 30 days", "C": "The password must be at least 8 characters long", "D": "The password must not include personal information"}, "correct": "B"}, {"question": "What technique is commonly used by attackers to retrieve sensitive information like usernames and passwords through a fraudulent request masquerading as a legitimate entity?", "options": {"A": "Pharming", "B": "Spoofing", "C": "Phishing", "D": "Smishing"}, "correct": "B"}, {"question": "A company allows employees to access email from personal phones. Security wants to reduce account takeover risk without blocking legitimate users. Which conditional access policy best meets this goal?", "options": {"A": "Allow access from any device as long as the password meets complexity requirements", "B": "Require a password change at every sign in from any location", "C": "Block all access from mobile devices and require desktop use on the corporate network", "D": "Require Multi-Factor Authentication (MFA) only when the sign in risk is high or the device is not marked compliant"}, "correct": "C"}, {"question": "An organization has recently experienced a data breach due to a phishing attack targeting its employees. To prevent similar incidents, which of the following actions should the organization prioritize?", "options": {"A": "Deploying network Intrusion Detection Systems", "B": "Conduct regular security awareness training for employees", "C": "Implementing endpoint protection software on all devices", "D": "Enforcing mandatory password changes every 60 days"}, "correct": "D"}, {"question": "An organization discovers its network is being scanned for vulnerabilities. What is the most immediate action it should take?", "options": {"A": "Contact law enforcement to report the activity", "B": "Conduct a full audit of all systems and devices", "C": "Block the scanning IP addresses at the firewall", "D": "Update all software and firewall rules"}, "correct": "B"}, {"question": "As the security manager at a large financial institution, you are responsible for implementing measures to ensure that only authorized employees are able to access sensitive client information. What is a common method for ensuring that only authorized users have access to certain resources or systems?", "options": {"A": "Logical access control", "B": "Physical access control", "C": "Encryption", "D": "Network segmentation"}, "correct": "A"}, {"question": "A company's network is experiencing increased latency and unexpected traffic patterns. An analysis of log files indicates that a large number of packets are being sent to a specific port, resulting in a Denial of Service. What type of attack is likely being executed?", "options": {"A": "DDoS", "B": "Phishing", "C": "Man-in-the-Middle (MitM)", "D": "SQL Injection"}, "correct": "A"}, {"question": "Which of the following represents a major vulnerability when implementing a cloud-based application for sensitive data processing?", "options": {"A": "Limited scalability of the cloud service", "B": "Insufficient user training on cloud platform usage", "C": "High latency in data access", "D": "Lack of encryption in data transmission"}, "correct": "A"}, {"question": "An organization wants to prevent users from reusing their last several passwords. Which configuration best supports that goal?", "options": {"A": "Increase the account lockout duration to 30 minutes after five failed attempts", "B": "Set a maximum password age of 45 days and require a symbol in every password", "C": "Enable password history and remember the last 24 passwords for each account", "D": "Require passwords to be stored using salted hashing instead of encryption"}, "correct": "D"}, {"question": "An organization has recently adopted a cloud-based solution to store confidential data. What should be the primary concern regarding the security of this data?", "options": {"A": "Data access control and encryption", "B": "Availability of internet connectivity for remote access", "C": "The geographic location of the cloud's data centers", "D": "The bandwidth between the organization and the cloud service"}, "correct": "C"}, {"question": "Following a data breach, a company decides to strengthen its password policies. Which of the following measures is most likely to enhance password security?", "options": {"A": "Using dictionary words to ensure memorability", "B": "Implementing Multi-Factor Authentication (MFA)", "C": "Encouraging users to change passwords monthly", "D": "Allowing password reuse after 90 days"}, "correct": "B"}, {"question": "A company is implementing a remote access solution for its employees. Which of the following should be used to ensure secure communication over an insecure network?", "options": {"A": "VLAN (Virtual Local Area Network)", "B": "DHCP (Dynamic Host Configuration Protocol)", "C": "VPN (Virtual Private Network)", "D": "NAT (Network Address Translation)"}, "correct": "C"}, {"question": "An organization has recently transitioned to a Cloud Service Provider (CSP) to store sensitive data. Which of the following would best ensure that data remains secure while in transit?", "options": {"A": "Applying authentication protocols", "B": "Implementing data access policies", "C": "Signing an NDA with the cloud provider", "D": "Using Transport Layer Security (TLS)"}, "correct": "D"}, {"question": "During an access review, you notice one employee has both the purchasing requester role and the purchasing approver role. The manager argues the employee is trustworthy and has been with the company for years. What is the best security response?", "options": {"A": "Remove one of the roles or add an independent approval step to restore separation of duties", "B": "Keep the access as is and document the manager approval as a compensating control", "C": "Require the employee to sign an acceptable use policy specific to purchasing", "D": "Rotate the employee password more frequently to reduce the risk of compromise"}, "correct": "A"}, {"question": "A payroll specialist temporarily covers for a manager during a leave of absence. Three months after the manager returns, the specialist can still approve new vendors and release payments. What is the most appropriate security concern to raise?", "options": {"A": "The specialist should be moved to a separate network segment to reduce risk", "B": "The specialist's account is likely compromised because the permissions changed", "C": "The organization should disable all delegation features to prevent future issues", "D": "Role creep has increased the specialist's privileges beyond what the job currently requ aining", "C": "Regularly updating and patching all software applications", "D": "Installing antivirus software on internal systems"}, "correct": "A"}, {"question": "Which of the following is the LEAST secure topology for a network?", "options": {"A": "Bus topology", "B": "Mesh topology", "C": "Ring topology", "D": "Star topology"}, "correct": "A"}, {"question": "An organization is concerned about attackers capturing sensitive data as it moves across the network. Which technology can best ensure the data remains confidential during transmission?", "options": {"A": "A Virtual Private Network (VPN)", "B": "Intrusion Prevention System (IPS)", "C": "Two-Factor Authentication (2FA)", "D": "Network segmentation"}, "correct": "A"}, {"question": "Which of the following should be included in the Business Continuity Planning (BCP) as the FIRST priority for maintaining business operations?", "options": {"A": "Maintaining communication channels", "B": "Providing employee support", "C": "Protecting company assets", "D": "Ensuring customer satisfaction"}, "correct": "A"}, {"question": "Which type of access control model would we use if availability is MOST important?", "options": {"A": "Discretionary Access Control (DAC)", "B": "Rule-Based Access Control (RuBAC)", "C": "Role-Based Access Control (RBAC)", "D": "Mandatory Access Control (MAC)"}, "correct": "A"}, {"question": "Consider a scenario where an organization is implementing a new Multi-Factor Authentication (MFA) system. What is the main goal of integrating MFA into the user's login process?", "options": {"A": "Reducing the risk of unauthorized access to systems", "B": "Enhancing User Experience (UX) by streamlining the login process", "C": "Allowing users to bypass traditional password requirements", "D": "Increasing the complexity of password policies"}, "correct": "A"}, {"question": "What type of access control model is based on the concept of a trusted third party for authentication?", "options": {"A": "Role-Based Acces  algorithms", "D": "Using a digital certificate for authentication"}, "correct": "D"}, {"question": "A company introduces self-service password resets. Which design choice best reduces account takeover risk?", "options": {"A": "Use knowledge-based questions", "B": "Send reset links to email only", "C": "Allow unlimited reset attempts", "D": "Require a second factor and rate-limit reset attempts"}, "correct": "D"}, {"question": "Which type of backup copies only data that has changed since the last backup of any type?", "options": {"A": "Full backup", "B": "Differential backup", "C": "Incremental backup", "D": "Snapshot"}, "correct": "A"}, {"question": "Which security principle requires users to have only the minimum permissions necessary to perform their job?", "options": {"A": "Defense in Depth", "B": "Least Privilege", "C": "Separation of Duties", "D": "Need to Know"}, "correct": "B"}, {"question": "Which control is designed to detect security incidents rather than prevent them?", "options": {"A": "Firewall", "B": "Antivirus", "C": "Intrusion Detection System (IDS)", "D": "Access Control List (ACL)"}, "correct": "C"}, {"question": "What is the primary purpose of a Security Information and Event Management (SIEM) system?", "options": {"A": "Encrypt network traffic", "B": "Aggregate and analyze security logs and events", "C": "Replace firewalls", "D": "Manage user passwords"}, "correct": "A"}, {"question": "What technique would a security administrator recommend to ensure that only authorized personnel can read sensitive files on a network share?", "options": {"A": "Setting file permissions and using Access Control List (ACL)", "B": "Implementing firewall rules to restrict access", "C": "Regularly updating antivirus signatures on network computers", "D": "Monitoring network traffic with an Intrusion Detection System (IDS)"}, "correct": "A"}, {"question": "When we design our defense in depth, we use multiple overlapping controls. Which of these is a type of preventative access control?", "options": {"A": "Detective", "B": "Deterrent", "C": "Technical", "D": "Corrective"}, "correct": "C"}, {"question": "Which of the following is a social engineering technique that can be used to gain unauthorized access to sensitive information?", "options": {"A": "DoS attacks", "B": "SQL Injection", "C": "Phishing attacks", "D": "DNS spoofing"}, "correct": "C"}, {"question": "What would we encrypt when we are dealing with sensitive data?", "options": {"A": "Wireless access points.", "B": "Laptops.", "C": "USB drives.", "D": "All of these."}, "correct": "D"}, {"question": "Which security measure can best limit the impact of phishing attacks on employees?", "options": {"A": "Implementing two-factor authentication", "B": "Installing antivirus software", "C": "Mandatory security training sessions", "D": "Deploying an Intrusion Detection System (IDS)"}, "correct": "A"}, {"question": "A risk committee asks for a concise definition of the software lifecycle to align procurement, operations, and security planning. Which description best captures the software lifecycle from a security management standpoint?", "options": {"A": "Install software once and avoid changes to preserve stability", "B": "Focus only on development practices and treat deployment and retirement as separate disciplines", "C": "Purchase software, renew licenses annually, and ignore versioning unless an outage occurs", "D": "Acquire or develop, deploy, maintain and patch, then decommission while tracking versions and support status throughout"}, "correct": "D"}, {"question": "During a routine audit, a security analyst discovers that multiple root login attempts have been made on the company's Linux servers using SSH. What would be an effective mitigation strategy?", "options": {"A": "Changing the default SSH port from 22 to 23", "B": "Implementing Account Lockout Thresholds", "C": "Using Public Key Infrastructure (PKI) for authentication", "D": "Disabling SSH on the network"}, "correct sments to confirm the comprehensiveness and effectiveness of the plan. What sequence of tests and assessments should be conducted to ensure the Disaster Recovery Plan (DRP)'s effectiveness?", "options": {"A": "Walk-through -> Review -> Checklist", "B": "Review -> Checklist -> Walk-through", "C": "Checklist -> Walk-through -> Review", "D": "Checklist -> Review -> Walk-through"}, "correct": "B"}, {"question": "A DevOps team is designing access for a new application. Which assignment best aligns with separation of duties between developer, deployer, and administrator?", "options": {"A": "Developers deploy to production, and deployers only monitor logs after release", "B": "Deployers can approve their own change tickets if the change is low risk", "C": "Administrators manage production access and configurations, deployers release approved builds, and developers commit code without production write access", "D": "Developers have production database administrator rights, while administrators handle code merges"}, "correct": "C"}, {"question": "You are the Chief Information Security Officer (CISO) for a large e-commerce company. As part of your responsibilities, you are reassessing the company's Disaster Recovery Plan (DRP). You've ensured the IT systems and data can be fully recovered within 12 hours following a disaster. But, the company's supply chain relies heavily on a single local supplier. You are considering the addition of a secondary supplier who will handle about 5% of the business initially but can scale up if the primary vendor is unable to operate. What is the most critical reason to include a secondary supplier in your Disaster Recovery strategy?", "options": {"A": "To prevent the primary vendor from exploiting a monopoly situation.", "B": "To ensure your company is not overly reliant on a single supplier.", "C": "To build a competitive environment that could potentially lead to better pricing.", "D": "To minimize the risk of your supply chain being disrupte al malfunction", "D": "Human error during maintenance"}, "correct": "C"}, {"question": "An organization is deploying a new virtualized environment. How can it best ensure the security of the Virtual Machines (VMs) against unauthorized access?", "options": {"A": "Install host-based firewalls on all VMs", "B": "Implement Multi-Factor Authentication (MFA) for VM management platforms", "C": "Utilize strong password policies across VM hosts", "D": "Use network segmentation to isolate VMs"}, "correct": "B"}, {"question": "What is a key difference between symmetric and asymmetric encryption methods in terms of performance?", "options": {"A": "Symmetric encryption provides stronger protection than asymmetric encryption", "B": "Asymmetric encryption scales better for large data volumes", "C": "Symmetric encryption uses more complex algorithms, making it slower", "D": "Symmetric encryption is generally faster due to simpler algorithms"}, "correct": "D"}, {"question": "Which of the following is the MOST effective approach to implementing Role-Based Access Control (RBAC) in a large organization?", "options": {"A": "Implementing a single, global role for all employees", "B": "Using a hierarchical approach to role assignment based on an individual's position in the organizational structure", "C": "Developing a set of roles based on the tasks and functions performed by individuals within the organization", "D": "Assigning roles to individuals based on their job titles"}, "correct": "C"}, {"question": "A company is considering moving its critical applications to a Cloud Service Provider (CSP). What is the most important factor to ensure security during this transition?", "options": {"A": "Cost savings associated with cloud migration", "B": "The cloud provider's reputation in the industry", "C": "The geographic location of the cloud provider's data centers", "D": "The cloud provider's compliance with relevant regulations"}, "correct": "D"}, {"question": "As the newly appointed Chief ining employees on security policies", "D": "Installing antivirus software"}, "correct": "D"}, {"question": "An organization has suffered multiple phishing attacks targeting its employees. Which of the following strategies would most effectively mitigate this risk?", "options": {"A": "Deploying an antivirus solution on all devices", "B": "Conducting phishing simulation exercises", "C": "Using two-factor authentication", "D": "Implementing network segmentation"}, "correct": "B"}, {"question": "As the IT Security Manager in your organization, you have need to convince the Chief Financial Officer (CFO) to approve a budget increase for the IT security department. This budget increase would allow the implementation of a new Security Information and Event Management (SIEM) system. You believe that the adoption of this system will enhance your organization's overall security posture and potentially lead to financial savings in the long run due to reduced incident response times and prevention of costly breaches. What is the most persuasive argument to present to the CFO to gain approval for this budget increase?", "options": {"A": "The SIEM system will improve the organization's reputation by demonstrating a proactive approach to security.", "B": "The SIEM system will help the organization stay compliant with the necessary regulations, potentially avoiding fines.", "C": "The SIEM system will enhance the efficiency of the IT security team, allowing them to respond to incidents more quickly, thereby reducing potential loss from security incidents.", "D": "The SIEM system is the latest technology in security, and not having it may put the organization at a disadvantage compared to competitors."}, "correct": "C"}, {"question": "Which of the following practices is essential in preventing the spread of ransomware within an organization's network?", "options": {"A": "Conduct phishing awareness training for employees", "B": "Utilize network segmentation", "C": "Regularly patch and update systems", "D": "Implement strict perimeter firewall rules"}, "correct": "B"}, {"question": "An employee reports receiving an email from an unknown source requesting personal information. What type of threat is this most likely an example of?", "options": {"A": "Scareware", "B": "Phishing", "C": "Pretexting", "D": "Spear phishing"}, "correct": "B"}, {"question": "In our access control implementations, we want to ensure the accountability of our users. Which of these could be something we could use for that?", "options": {"A": "Their username.", "B": "Role-Based Access Control (RBAC).", "C": "Non-repudiation.", "D": "A password."}, "correct": "C"}, {"question": "Which of the following is NOT a characteristic of effective compartmentalization in an organization?", "options": {"A": "Access to sensitive information is restricted to only those who need it", "B": "Clear boundaries between departments and roles", "C": "Lack of communication between departments", "D": "Permissions granted to individuals based on their job function"}, "correct": "C"}, {"question": "How does a security officer evaluate the security posture of an organization?", "options": {"A": "By implementing strict access controls", "B": "By implementing a security awareness program", "C": "By implementing a comprehensive security policy", "D": "By conducting regular vulnerability assessments"}, "correct": "D"}, {"question": "An organization wants to limit the damage from a potential insider threat. Which of the following practices should they adopt?", "options": {"A": "Increase network bandwidth", "B": "Consolidate servers into a single data center", "C": "Implement Role-Based Access Control (RBAC)", "D": "Enhance physical security measures"}, "correct": "C"}, {"question": "The company has 500 employees, with about 50% working remotely. The company's IT infrastructure includes servers, workstations, and laptops. The company has experienced multiple data breaches in the past year, with the most recent one being a ransomware attack that encrypted all of the company's data. The company has limited resources and budget for IT security improvements. We are making our procedures on the proper use and disposal of SSD drives. Which type of drives which are they?", "options": {"A": "Magnetic drives", "B": "Hybrid drives", "C": "Solid-State drives", "D": "Optical drives"}, "correct": "C"}, {"question": "During a security audit, an organization discovers that employees are frequently accessing inappropriate websites. Which mechanism can help the organization control and monitor web traffic effectively?", "options": {"A": "Enforcing strict password policies for internet access", "B": "Conducting regular employee training programs on acceptable use", "C": "Implementing a firewall with content filtering capabilities", "D": "Deploying an Intrusion Detection System (IDS)"}, "correct": "C"}, {"question": "We have an employee who is moving from IT to HR. If we are using Role-Based Access Control (RBAC), what would we do to his access?", "options": {"A": "Leave his access as is", "B": "Remove his access completely", "C": "Change his access to IT-specific access", "D": "Change his access to HR-specific access"}, "correct": "D"}, {"question": "A company uses dual control for wire transfers above a set amount. An employee suggests that one person can approve on behalf of the other when the second approver is on vacation, as long as it is documented. What is the best response from a security perspective?", "options": {"A": "Accept the approach because documentation provides sufficient accountability", "B": "Permit it if the transaction is reviewed by finance at the end of the week", "C": "Reject it because dual control requires independent participation, so a backup approver should be assigned instead", "D": "Allow it only if the employee uses a shared team account for approvals"}, "correct": "C"}, {"question": "Which of the following encryption methods is primarily used to protect data at rest?", "options": {"A": "AES", "B": "IPSec", "C": "SSL/TLS", "D": "PGP"}, "correct": "A"}]};
    let currentSetNum = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    
    // Store user answers array to calculate at the end
    // Format: { questionData, selected }
    let userAnswers = [];
    let selectedAnswer = null;

    // Helper function to shuffle an array
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function loadSet(setNum) {
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        event?.target?.classList.add('active');
        if(!event) {
            document.querySelectorAll('.nav-link')[setNum-1].classList.add('active');
        }
        
        currentSetNum = setNum;
        
        // Deep copy and shuffle questions
        let questionsToLoad = JSON.parse(JSON.stringify(rawExamData['set' + setNum]));
        currentQuestions = shuffleArray(questionsToLoad);
        
        currentIndex = 0;
        userAnswers = [];
        
        document.getElementById('summary-view').style.display = 'none';
        document.getElementById('question-view').style.display = 'block';
        document.getElementById('module-indicator').innerHTML = `<i class="fas fa-layer-group me-2"></i> Module ${setNum}`;
        
        renderQuestion();
    }
    
    function loadNextSet() {
        let nextSet = currentSetNum === 3 ? 1 : currentSetNum + 1;
        loadSet(nextSet);
        window.scrollTo(0,0);
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        selectedAnswer = null;
        
        document.getElementById('question-counter').innerHTML = `Q: ${currentIndex + 1} / ${currentQuestions.length}`;
        const progressPercent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        
        document.getElementById('question-text').innerText = q.question;
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        for (const [key, val] of Object.entries(q.options)) {
            optsContainer.innerHTML += `
                <div id="opt_${key}" class="option-block" onclick="selectOption('${key}')">
                    <div class="option-letter">${key}</div>
                    <div class="option-text">${val}</div>
                </div>
            `;
        }
        
        document.getElementById('btn-next').disabled = true;
        
        const cardBody = document.getElementById('card-body-content');
        cardBody.classList.remove('fade-transition');
        void cardBody.offsetWidth; // trigger reflow
        cardBody.classList.add('fade-transition');
    }

    function selectOption(key) {
        selectedAnswer = key;
        
        document.querySelectorAll('.option-block').forEach(el => {
            el.classList.remove('selected');
        });
        document.getElementById('opt_' + key).classList.add('selected');
        
        // Enable Next button
        document.getElementById('btn-next').disabled = false;
    }

    function nextQuestion() {
        if (!selectedAnswer) return;
        
        // Save user's answer
        userAnswers.push({
            questionData: currentQuestions[currentIndex],
            selected: selectedAnswer
        });

        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            showSummary();
        } else {
            renderQuestion();
        }
    }
    
    function showSummary() {
        // Ensure progress bar fills up
        document.getElementById('progress-bar').style.width = '100%';
        
        document.getElementById('question-view').style.display = 'none';
        document.getElementById('summary-view').style.display = 'block';
        
        let score = 0;
        let reviewHtml = '';
        
        userAnswers.forEach((ans, idx) => {
            const qData = ans.questionData;
            const isCorrect = ans.selected === qData.correct;
            if(isCorrect) score++;
            
            const userChoiceText = qData.options[ans.selected];
            const correctChoiceText = qData.options[qData.correct];
            
            reviewHtml += `
                <div class="review-item">
                    <div class="review-question">${idx + 1}. ${qData.question}</div>
                    <div class="d-flex flex-column gap-2 mt-3">
                        ${isCorrect 
                            ? `<div class="review-badge correct m-0"><i class="fas fa-check-circle fs-5"></i><span><strong>Your Answer:</strong> ${ans.selected} - ${userChoiceText}</span></div>` 
                            : `<div class="review-badge wrong m-0"><i class="fas fa-times-circle fs-5"></i><span><strong>Your Answer:</strong> ${ans.selected} - ${userChoiceText}</span></div>
                               <div class="review-badge correct m-0"><i class="fas fa-check-circle fs-5"></i><span><strong>Correct Answer:</strong> ${qData.correct} - ${correctChoiceText}</span></div>`
                        }
                    </div>
                </div>
            `;
        });
        
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-total').innerText = currentQuestions.length;
        document.getElementById('review-container').innerHTML = reviewHtml;
    }

    // Initialize first set
    window.onload = () => loadSet(1);
</script>
</body>
</html>
